<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Plan — MEXCOR Workspace</title>
<style>
:root{
  --navy:#2b3260; --steel:#3a6eb5;
  --bg:#f0f2f8; --surface:#ffffff; --border:#e4e2d8; --text:#1a1a18; --muted:#767464;
  --danger-bg:#fcebeb; --danger-text:#a32d2d;
  --ok-bg:#eaf3de; --ok-text:#3b6d11;
  --warn-bg:#faeeda; --warn-text:#854f0b;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
body{background:var(--bg);color:var(--text);padding:0 5% 60px;}
h1{font-size:20px;font-weight:600;padding:20px 0 4px;}
.sub{font-size:12px;color:var(--muted);padding-bottom:16px;}
.status-bar{padding:8px 14px;border-radius:8px;font-size:12px;margin-bottom:16px;}
.status-bar.loading{background:#f1efe8;color:var(--muted);}
.status-bar.success{background:var(--ok-bg);color:var(--ok-text);}
.status-bar.error{background:var(--danger-bg);color:var(--danger-text);}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:14px 16px;}
.card .lbl{font-size:12px;color:var(--muted);margin-bottom:4px;}
.card .val{font-size:20px;font-weight:600;}
.card .val.danger{color:var(--danger-text);}
.card .val.ok{color:var(--ok-text);}
.card .adjbtn{font-size:10px;color:var(--steel);cursor:pointer;margin-top:4px;display:inline-block;}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.toolbar select{padding:7px 10px;border:0.5px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:11px;padding:4px 10px;background:var(--surface);border:0.5px solid var(--border);border-radius:20px;color:var(--muted);cursor:pointer;}
.chip:hover{border-color:var(--steel);color:var(--steel);}
.chip .x{margin-left:5px;opacity:.5;}
.chip.add{border-style:dashed;}

.quickadd{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:20px;}
.quickadd .lbl{font-size:13px;font-weight:600;margin-bottom:10px;}
.quickadd .row{display:grid;grid-template-columns:70px 70px 1fr 120px 90px;gap:8px;}
.quickadd select,.quickadd input{padding:8px 9px;border:0.5px solid var(--border);border-radius:6px;font-size:13px;background:#faf9f5;}
.quickadd button{background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
.quickadd button:hover{background:#3a4278;}

.week-block{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.week-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--navy);color:#fff;cursor:pointer;font-size:13px;font-weight:600;}
.week-head .meta{font-size:11px;font-weight:400;opacity:.8;}
.week-grid{display:none;grid-template-columns:56px repeat(6,1fr);}
.week-grid.open{display:grid;}
.dhead{font-size:11px;color:var(--muted);text-align:center;padding:8px 4px;border-bottom:0.5px solid var(--border);background:#fafaf7;}
.rowlbl{font-size:11px;font-weight:600;color:var(--muted);padding:8px 6px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;}
.daycell{padding:4px;border-bottom:0.5px solid var(--border);border-left:0.5px solid var(--border);min-height:30px;}
.daycell.balance{background:#fafaf7;font-size:12px;text-align:center;padding:8px 4px;font-weight:600;}
.daycell.balance .usd{color:var(--muted);font-weight:400;font-size:11px;display:block;}
.entry{font-size:11px;padding:5px 6px;border-radius:4px;margin-bottom:3px;position:relative;}
.entry.ap{background:var(--danger-bg);color:var(--danger-text);}
.entry.ar{background:var(--ok-bg);color:var(--ok-text);}
.entry.adj{background:var(--warn-bg);color:var(--warn-text);}
.entry .amt{font-weight:600;display:block;margin-top:1px;}
.entry .who{font-size:9px;opacity:.75;display:block;margin-top:2px;}
.entry .del{position:absolute;top:3px;right:4px;font-size:11px;cursor:pointer;opacity:.6;}
.entry .del:hover{opacity:1;}
.addline{font-size:10px;color:var(--muted);border:1px dashed var(--border);border-radius:4px;text-align:center;padding:4px;cursor:pointer;}
.addline:hover{border-color:var(--steel);color:var(--steel);}
.empty{padding:16px;font-size:13px;color:var(--muted);text-align:center;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:500;}
.modal{background:var(--surface);border-radius:12px;padding:20px;width:340px;}
.modal h2{font-size:15px;margin-bottom:12px;}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.modal input,.modal select,.modal textarea{width:100%;padding:8px 9px;border:0.5px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:10px;font-family:inherit;}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;}
.modal button{padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;border:0.5px solid var(--border);background:var(--surface);}
.modal button.primary{background:var(--navy);color:#fff;border:none;}
</style>
</head>
<body>

<h1>Budget Plan</h1>
<p class="sub" id="lastUpdate">데이터 불러오는 중...</p>
<div class="status-bar loading" id="statusBox">구글 시트에서 데이터를 불러오는 중...</div>

<div id="mainContent" style="display:none;">

  <div class="cards">
    <div class="card">
      <div class="lbl" data-ko="MXN 잔고" data-es="Saldo MXN">MXN 잔고</div>
      <div class="val" id="balMXN">-</div>
      <span class="adjbtn" onclick="openAdjust('MXN')" data-ko="잔고 수정" data-es="Ajustar saldo">잔고 수정</span>
    </div>
    <div class="card">
      <div class="lbl" data-ko="USD 잔고" data-es="Saldo USD">USD 잔고</div>
      <div class="val" id="balUSD">-</div>
      <span class="adjbtn" onclick="openAdjust('USD')" data-ko="잔고 수정" data-es="Ajustar saldo">잔고 수정</span>
    </div>
    <div class="card">
      <div class="lbl" data-ko="이번 주 AP" data-es="CxP esta semana">이번 주 AP</div>
      <div class="val danger" id="weekAP">-</div>
    </div>
    <div class="card">
      <div class="lbl" data-ko="이번 주 AR" data-es="CxC esta semana">이번 주 AR</div>
      <div class="val ok" id="weekAR">-</div>
    </div>
  </div>

  <div class="toolbar">
    <select id="monthFilter"></select>
    <div class="chips" id="chips"></div>
  </div>

  <div class="quickadd">
    <div class="lbl" data-ko="빠른 입력" data-es="Entrada rápida">빠른 입력</div>
    <div class="row" style="grid-template-columns:100px 70px 70px 1fr 110px 90px;">
      <input type="date" id="qDate">
      <select id="qType"><option value="AP">AP</option><option value="AR">AR</option></select>
      <select id="qCur"><option value="MXN">MXN</option><option value="USD">USD</option></select>
      <input type="text" id="qItem" placeholder="항목명" data-ko-ph="항목명" data-es-ph="Concepto">
      <input type="number" id="qAmt" placeholder="금액" data-ko-ph="금액" data-es-ph="Monto">
      <button onclick="quickAdd()" data-ko="추가" data-es="Agregar">추가</button>
    </div>
  </div>

  <div id="weeksContainer"></div>

</div>

<!-- 잔고 수동 수정 모달 -->
<div class="modal-bg" id="adjustModal" onclick="if(event.target===this)closeAdjust()">
  <div class="modal">
    <h2 id="adjustTitle" data-ko="잔고 수동 수정" data-es="Ajustar saldo manualmente">잔고 수동 수정</h2>
    <input type="number" id="adjustAmount" placeholder="정확한 현재 잔고" data-ko-ph="정확한 현재 잔고" data-es-ph="Saldo actual exacto">
    <textarea id="adjustReason" rows="3" placeholder="수정 사유 (필수)" data-ko-ph="수정 사유 (필수)" data-es-ph="Motivo del ajuste (obligatorio)"></textarea>
    <div class="foot">
      <button onclick="closeAdjust()" data-ko="취소" data-es="Cancelar">취소</button>
      <button class="primary" onclick="confirmAdjust()" data-ko="확정" data-es="Confirmar">확정</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="nav.js"></script>
<script>
const SURL='https://oezergrrqcinclorwvnk.supabase.co';
const SKEY='sb_publishable_1eqTksIg-IetXykOBHf0rg_19ourTmF';
let sb=window._mexcorSb||null;

let curLang = localStorage.getItem('mexcor_lang')||'ko';
let entries=[];
let frequent=[];
let fxRates={};
let adjustCurrency='MXN';

const T_KO={loading:'데이터 불러오는 중...',syncOk:'✓ 데이터 연동 성공',syncFail:m=>'❌ 오류 — '+m,
  lastUpd:'최종 업데이트: ',noEntries:'입력된 내역이 없어요',today:'오늘',cnt:'건'};
const T_ES={loading:'Cargando datos...',syncOk:'✓ Sincronizado',syncFail:m=>'❌ Error — '+m,
  lastUpd:'Última actualización: ',noEntries:'No hay registros',today:'Hoy',cnt:''};
function T(){ return curLang==='es'?T_ES:T_KO; }
document.addEventListener('mexcorLangChange',function(e){ curLang=e.detail.lang; renderAll(); });

function _startBudget(user){
  if(!user || !user.user_metadata?.budget){
    location.href='summary_live.html';
    return;
  }
  sb = window._mexcorSb || sb;
  if(!sb){ try{ sb=supabase.createClient(SURL,SKEY); }catch(e){} }
  loadAll();
}
if(window._mexcorUser!==undefined){
  _startBudget(window._mexcorUser);
} else {
  document.addEventListener('mexcorAuthReady', e=>_startBudget(e.detail.user));
}

function getFxRate(dateStr){
  if(fxRates[dateStr]!==undefined) return fxRates[dateStr];
  const known = Object.keys(fxRates).filter(d=>d<=dateStr).sort().reverse();
  if(known.length) return fxRates[known[0]];
  const anyKnown = Object.keys(fxRates).sort();
  if(anyKnown.length) return fxRates[anyKnown[0]];
  return 17.0;
}
async function saveFxRate(dateStr, val){
  const rate = parseFloat(val);
  if(isNaN(rate) || rate<=0) return;
  fxRates[dateStr] = rate;
  const {error} = await sb.from('budget_fx_rates').upsert({entry_date:dateStr, rate}, {onConflict:'entry_date'});
  if(error){ alert(error.message); return; }
  renderWeeks();
}
function currentUserId(){
  return (window._mexcorUser?.email||'user').split('@')[0];
}
document.getElementById('qDate').value = new Date().toISOString().slice(0,10);
function setQDate(dateStr){
  document.getElementById('qDate').value = dateStr;
  document.getElementById('qItem').focus();
  document.getElementById('qDate').scrollIntoView({behavior:'smooth',block:'center'});
}

async function loadAll(){
  if(!sb){
    document.getElementById('statusBox').className='status-bar error';
    document.getElementById('statusBox').textContent=T().syncFail('연결 실패');
    return;
  }
  try{
    const {data:ent,error:e1}=await sb.from('budget_entries').select('*').order('entry_date',{ascending:false}).order('created_at',{ascending:false});
    if(e1) throw e1;
    entries=ent||[];
    const {data:freq,error:e2}=await sb.from('budget_frequent_items').select('*').order('name');
    if(e2) throw e2;
    frequent=freq||[];
    const {data:fx,error:e3}=await sb.from('budget_fx_rates').select('*');
    if(e3) throw e3;
    fxRates={};
    (fx||[]).forEach(r=>{ fxRates[r.entry_date]=parseFloat(r.rate); });

    populateMonthFilter();
    renderAll();

    document.getElementById('statusBox').className='status-bar success';
    document.getElementById('statusBox').textContent=T().syncOk;
    document.getElementById('lastUpdate').textContent=T().lastUpd+new Date().toLocaleString('ko-KR');
    document.getElementById('mainContent').style.display='block';
  }catch(e){
    document.getElementById('statusBox').className='status-bar error';
    document.getElementById('statusBox').textContent=T().syncFail(e.message);
  }
}

// ===== 잔고 계산 =====
// 가장 최근 ADJUSTMENT를 기준점으로, 그 이후 AR(+) / AP(-) 를 누적
function computeBalance(currency, asOfDate){
  const relevant = entries.filter(e=>e.currency===currency && (!asOfDate || e.entry_date<=asOfDate));
  const lastAdj = relevant.filter(e=>e.type==='ADJUSTMENT').sort((a,b)=>b.entry_date.localeCompare(a.entry_date)||b.created_at.localeCompare(a.created_at))[0];
  let base = 0, fromDate = null;
  if(lastAdj){ base = parseFloat(lastAdj.amount); fromDate = lastAdj.entry_date; }
  const since = relevant.filter(e=>e.type!=='ADJUSTMENT' && (!fromDate || e.entry_date>fromDate || (e.entry_date===fromDate && e.created_at>lastAdj.created_at)));
  const net = since.reduce((s,e)=> s + (e.type==='AR'?parseFloat(e.amount):-parseFloat(e.amount)), 0);
  return base + net;
}

function isoWeek(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay()===0?7:d.getDay();
  const monday = new Date(d); monday.setDate(d.getDate()-day+1);
  const saturday = new Date(monday); saturday.setDate(monday.getDate()+5);
  const key = monday.toISOString().slice(0,10);
  return {key, start:monday, end:saturday};
}

// 해당 월에 걸치는 모든 주(과거+미래 포함) - 계획 수립용으로 데이터 없어도 다 보여줌
function weeksInMonth(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  const firstDay = new Date(y, m-1, 1);
  const lastDay = new Date(y, m, 0);
  const weeks = {};
  let cursor = new Date(firstDay);
  while(cursor<=lastDay){
    const wk = isoWeek(cursor.toISOString().slice(0,10));
    weeks[wk.key] = wk;
    cursor.setDate(cursor.getDate()+7);
  }
  // 월 마지막 주도 확실히 포함
  const lastWk = isoWeek(lastDay.toISOString().slice(0,10));
  weeks[lastWk.key] = lastWk;
  return Object.values(weeks).sort((a,b)=>a.key.localeCompare(b.key));
}

function fmtMoney(n){
  return Math.round(n).toLocaleString('en-US');
}

function renderAll(){
  const bMXN = computeBalance('MXN');
  const bUSD = computeBalance('USD');
  document.getElementById('balMXN').textContent = '$'+fmtMoney(bMXN);
  document.getElementById('balUSD').textContent = '$'+fmtMoney(bUSD);

  const now = new Date();
  const wk = isoWeek(now.toISOString().slice(0,10));
  const weekEntries = entries.filter(e=>{
    const ed = new Date(e.entry_date+'T00:00:00');
    return ed>=wk.start && ed<=wk.end;
  });
  const weekAP = weekEntries.filter(e=>e.type==='AP').reduce((s,e)=>s+parseFloat(e.amount),0);
  const weekAR = weekEntries.filter(e=>e.type==='AR').reduce((s,e)=>s+parseFloat(e.amount),0);
  document.getElementById('weekAP').textContent = '$'+fmtMoney(weekAP);
  document.getElementById('weekAR').textContent = '$'+fmtMoney(weekAR);

  renderChips();
  renderWeeks();
}

function renderChips(){
  const el = document.getElementById('chips');
  el.innerHTML = '';
  frequent.forEach(f=>{
    const c = document.createElement('span');
    c.className = 'chip';
    c.innerHTML = f.name + '<span class="x">✕</span>';
    c.onclick = (e)=>{
      if(e.target.classList.contains('x')){ deleteFrequent(f.id); return; }
      document.getElementById('qItem').value = f.name;
      document.getElementById('qAmt').focus();
    };
    el.appendChild(c);
  });
  const add = document.createElement('span');
  add.className = 'chip add';
  add.textContent = curLang==='es'?'+ agregar':'+ 항목 추가';
  add.onclick = addFrequent;
  el.appendChild(add);
}

async function addFrequent(){
  const name = prompt(curLang==='es'?'Nombre del nuevo concepto':'새 항목명');
  if(!name || !name.trim()) return;
  if(frequent.some(f=>f.name===name.trim())) return;
  const {error} = await sb.from('budget_frequent_items').insert({name:name.trim()});
  if(error){ alert(error.message); return; }
  await loadAll();
}
async function deleteFrequent(id){
  const {error} = await sb.from('budget_frequent_items').delete().eq('id',id);
  if(error){ alert(error.message); return; }
  await loadAll();
}

function populateMonthFilter(){
  const sel = document.getElementById('monthFilter');
  const months = new Set(entries.map(e=>e.entry_date.slice(0,7)));
  const now = new Date();
  months.add(now.toISOString().slice(0,7));
  for(let i=1;i<=2;i++){
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    months.add(d.toISOString().slice(0,7));
  }
  const sorted = [...months].sort().reverse();
  sel.innerHTML = sorted.map(m=>`<option value="${m}">${m.slice(0,4)}년 ${parseInt(m.slice(5,7))}월</option>`).join('');
  sel.value = now.toISOString().slice(0,7);
  sel.onchange = renderWeeks;
}

const DOW_KO=['월','화','수','목','금','토'];
const DOW_ES=['Lun','Mar','Mié','Jue','Vie','Sáb'];

function renderWeeks(){
  const sel = document.getElementById('monthFilter');
  const month = sel ? sel.value : new Date().toISOString().slice(0,7);
  const monthWeeks = weeksInMonth(month).reverse(); // 최신 주 먼저
  const todayStr = new Date().toISOString().slice(0,10);
  const container = document.getElementById('weeksContainer');
  const dowLabels = curLang==='es'?DOW_ES:DOW_KO;

  container.innerHTML = monthWeeks.map((w,idx)=>{
    const days = [];
    for(let i=0;i<6;i++){ const d=new Date(w.start); d.setDate(w.start.getDate()+i); days.push(d); }
    const dayKeys = days.map(d=>d.toISOString().slice(0,10));
    const weekItems = entries.filter(e=>dayKeys.includes(e.entry_date));
    const isFutureWeek = w.start.toISOString().slice(0,10) > todayStr;

    const apRow = dayKeys.map(dk=>{
      const items = weekItems.filter(e=>e.entry_date===dk && e.type==='AP');
      const cards = items.map(e=>`<div class="entry ap">${escapeHtml(e.item)}<span class="amt">$${fmtMoney(e.amount)} ${e.currency}</span><span class="who">${escapeHtml(e.created_by||'')} · ${dk.slice(5).replace('-','/')}</span><span class="del" onclick="deleteEntry('${e.id}')">✕</span></div>`).join('');
      return `<div class="daycell">${cards}<div class="addline" onclick="setQDate('${dk}');document.getElementById('qType').value='AP';">+ 추가</div></div>`;
    }).join('');

    const arRow = dayKeys.map(dk=>{
      const items = weekItems.filter(e=>e.entry_date===dk && e.type==='AR');
      const cards = items.map(e=>`<div class="entry ar">${escapeHtml(e.item)}<span class="amt">$${fmtMoney(e.amount)} ${e.currency}</span><span class="who">${escapeHtml(e.created_by||'')} · ${dk.slice(5).replace('-','/')}</span><span class="del" onclick="deleteEntry('${e.id}')">✕</span></div>`).join('');
      return `<div class="daycell">${cards}<div class="addline" onclick="setQDate('${dk}');document.getElementById('qType').value='AR';">+ 추가</div></div>`;
    }).join('');

    const adjItems = weekItems.filter(e=>e.type==='ADJUSTMENT');
    const hasAdj = adjItems.length>0;
    const adjRow = dayKeys.map(dk=>{
      const items = adjItems.filter(e=>e.entry_date===dk);
      const cards = items.map(e=>`<div class="entry adj">${curLang==='es'?'Ajuste':'잔고 수동 수정'}<span class="amt">=$${fmtMoney(e.amount)} ${e.currency}</span><span class="who">${escapeHtml(e.created_by||'')} · ${e.note?escapeHtml(e.note)+' · ':''}${dk.slice(5).replace('-','/')}</span></div>`).join('');
      return `<div class="daycell">${cards}</div>`;
    }).join('');

    const fxRow = dayKeys.map(dk=>{
      const rate = getFxRate(dk);
      return `<div class="daycell" style="text-align:center;"><input type="number" step="0.01" value="${rate.toFixed(2)}" style="width:100%;font-size:11px;padding:3px;border:0.5px solid var(--border);border-radius:4px;text-align:center;" onchange="saveFxRate('${dk}',this.value)"></div>`;
    }).join('');

    const balRow = dayKeys.map(dk=>{
      const bMXN = computeBalance('MXN', dk);
      const bUSD = computeBalance('USD', dk);
      const rate = getFxRate(dk);
      const total = bMXN + bUSD*rate;
      return `<div class="daycell balance">${fmtMoney(total)}<span class="usd">MXN ${fmtMoney(bMXN)} · USD ${fmtMoney(bUSD)}</span></div>`;
    }).join('');

    const fmt = d => (d.getMonth()+1)+'/'+d.getDate();
    const totalCount = weekItems.filter(e=>e.type!=='ADJUSTMENT').length;

    return `<div class="week-block">
      <div class="week-head" onclick="this.nextElementSibling.classList.toggle('open')">
        <span>${fmt(w.start)} — ${fmt(w.end)}${isFutureWeek?(curLang==='es'?' · próxima':' · 예정'):''}</span>
        <span class="meta">${totalCount}${T().cnt}</span>
      </div>
      <div class="week-grid${idx===0?' open':''}">
        <div class="dhead"></div>
        ${days.map((d,i)=>`<div class="dhead">${d.getMonth()+1}/${d.getDate()}<br>${dowLabels[i]}</div>`).join('')}
        <div class="rowlbl">AP</div>${apRow}
        <div class="rowlbl">AR</div>${arRow}
        ${hasAdj?`<div class="rowlbl">${curLang==='es'?'Ajuste':'조정'}</div>${adjRow}`:''}
        <div class="rowlbl">${curLang==='es'?'T.C.':'환율'}</div>${fxRow}
        <div class="rowlbl">${curLang==='es'?'Total':'총합'}</div>${balRow}
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s||'';
  return d.innerHTML;
}

async function quickAdd(){
  const type = document.getElementById('qType').value;
  const currency = document.getElementById('qCur').value;
  const item = document.getElementById('qItem').value.trim();
  const amount = parseFloat(document.getElementById('qAmt').value);
  const entryDate = document.getElementById('qDate').value || new Date().toISOString().slice(0,10);
  if(!item || !amount){ return; }
  const {error} = await sb.from('budget_entries').insert({
    entry_date: entryDate,
    type, currency, item, amount,
    created_by: currentUserId()
  });
  if(error){ alert((curLang==='es'?'Error al guardar: ':'저장 실패: ')+error.message); return; }
  document.getElementById('qItem').value='';
  document.getElementById('qAmt').value='';
  document.getElementById('qItem').focus();
  await loadAll();
}

async function deleteEntry(id){
  if(!confirm(curLang==='es'?'¿Eliminar este registro?':'이 항목을 삭제할까요?')) return;
  const {error} = await sb.from('budget_entries').delete().eq('id',id);
  if(error){ alert(error.message); return; }
  await loadAll();
}

function openAdjust(currency){
  adjustCurrency = currency;
  document.getElementById('adjustTitle').textContent = (curLang==='es'?'Ajustar saldo ':'잔고 수정 — ')+currency;
  document.getElementById('adjustAmount').value = Math.round(computeBalance(currency));
  document.getElementById('adjustReason').value = '';
  document.getElementById('adjustModal').style.display='flex';
}
function closeAdjust(){
  document.getElementById('adjustModal').style.display='none';
}
async function confirmAdjust(){
  const amount = parseFloat(document.getElementById('adjustAmount').value);
  const reason = document.getElementById('adjustReason').value.trim();
  if(isNaN(amount) || !reason){
    alert(curLang==='es'?'Ingrese el monto y el motivo':'금액과 사유를 입력해주세요');
    return;
  }
  const {error} = await sb.from('budget_entries').insert({
    entry_date: new Date().toISOString().slice(0,10),
    type:'ADJUSTMENT', currency:adjustCurrency, item: curLang==='es'?'Ajuste de saldo':'잔고 수동 수정',
    amount, note: reason, created_by: currentUserId()
  });
  if(error){ alert((curLang==='es'?'Error: ':'오류: ')+error.message); return; }
  closeAdjust();
  await loadAll();
}
</script>
